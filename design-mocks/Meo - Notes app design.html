<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Meo — Notes app design</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  input::placeholder { color: #8A8375; }
  kbd { font-family: 'JetBrains Mono', monospace; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="macos-window.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components/theme.jsx"></script>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/data.jsx"></script>
<script type="text/babel" src="components/note-renderer.jsx"></script>
<script type="text/babel" src="components/ai-controls.jsx"></script>
<script type="text/babel" src="components/markdown-editor.jsx"></script>
<script type="text/babel" src="components/models-screen.jsx"></script>
<script type="text/babel" src="components/desktop.jsx"></script>
<script type="text/babel" src="components/mobile.jsx"></script>

<script type="text/babel">
  // ─── Tweakable defaults (persisted by host) ──────────────────────────
  const TWEAKS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "density": "compact",
    "aiPlacement": "both",
    "view": "canvas"
  }/*EDITMODE-END*/;

  function App() {
    const [tw, setTw] = React.useState(TWEAKS);
    const [tweaksOn, setTweaksOn] = React.useState(false);
    const [searchOpen, setSearchOpen] = React.useState(false);
    const [aiPanelOpen, setAiPanelOpen] = React.useState(true);
    const dark = tw.theme === 'dark';

    React.useEffect(() => {
      const onMsg = (e) => {
        if (e.data?.type === '__activate_edit_mode') setTweaksOn(true);
        if (e.data?.type === '__deactivate_edit_mode') setTweaksOn(false);
      };
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: '__edit_mode_available' }, '*');
      return () => window.removeEventListener('message', onMsg);
    }, []);

    const update = (patch) => {
      const next = { ...tw, ...patch };
      setTw(next);
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
    };

    // ── Layout ─────────────────────────────────────────────────────────
    return (
      <>
        <DesignCanvas>
          {/* ── Section 1: Desktop — the main app ─────────────────────── */}
          <DCSection
            title="Meo for Mac  ·  the main app"
            subtitle="3-pane: folders, notes list, editor. Serif body, sans UI, mossy-green accent. Markdown is live but invisible — users write what they see.">
            <DCArtboard label="Desktop  ·  1280×820  ·  default workspace"
              width={1280} height={820}>
              <MacOSShell>
                <DesktopApp
                  dark={dark}
                  density={tw.density}
                  aiMode={tw.aiPlacement}
                  selectedNoteId="n1"
                  selectedFolder="work"
                  aiPanelOpen={false}
                  onOpenSearch={() => {}}
                  onOpenAI={() => {}}/>
              </MacOSShell>
            </DCArtboard>

            <DCPostIt top={-30} left={1110} rotate={3} width={190}>
              Opens cleanly — no clutter, no AI begging for attention.
            </DCPostIt>
          </DCSection>

          {/* ── Section 2: Search + AI — the two hero interactions ───── */}
          <DCSection
            title="Search & AI  ·  both reachable from ⌘K"
            subtitle="One search field answers questions AND finds notes. A side panel for longer conversations. A slash menu for quick edits inline.">

            <DCArtboard label="⌘K search — question + answer + sources"
              width={1280} height={820}>
              <MacOSShell>
                <DesktopApp dark={dark} density={tw.density} aiMode={tw.aiPlacement}
                  selectedNoteId="n1" selectedFolder="work" searchOpen={true}/>
              </MacOSShell>
            </DCArtboard>

            <DCArtboard label="Ask Meo — side panel, scoped to this note"
              width={1280} height={820}>
              <MacOSShell>
                <DesktopApp dark={dark} density={tw.density} aiMode="both"
                  selectedNoteId="n1" selectedFolder="work" aiPanelOpen={true}/>
              </MacOSShell>
            </DCArtboard>
          </DCSection>

          {/* ── Section 2.5: AI controls — switch + model dropdown ────── */}
          <DCSection
            title="AI controls  ·  on/off + model picker"
            subtitle="AI is opt-in. The dropdown distinguishes local models (green, runs on your device) from cloud models (red, sends note contents to a 3rd party).">

            <DCArtboard label="Model picker open — local + cloud" width={1280} height={820}>
              <MacOSShell>
                <DesktopApp dark={dark} density={tw.density} aiMode={tw.aiPlacement}
                  selectedNoteId="n1" selectedFolder="work"
                  aiOn={true} model="meo-mini" modelDropdownOpen={true}/>
              </MacOSShell>
            </DCArtboard>

            <DCArtboard label="AI off — dropdown disabled" width={1280} height={820}>
              <MacOSShell>
                <DesktopApp dark={dark} density={tw.density} aiMode="none"
                  selectedNoteId="n1" selectedFolder="work"
                  aiOn={false} model="meo-mini"/>
              </MacOSShell>
            </DCArtboard>

            <DCPostIt top={-30} left={1180} rotate={-2} width={210}>
              Green = lives on your device. Red = leaves your device. The choice is always visible.
            </DCPostIt>
          </DCSection>

          {/* ── Section 2.6: Models download screen ─────────────── */}
          <DCSection
            title="Settings · download local models"
            subtitle="A curated, audited list of open-source models with permissive licenses. One tap to install — then your notes never leave the device.">
            <DCArtboard label="Settings → AI & Models → Available" width={1280} height={820}>
              <MacOSShell>
                <ModelsDownloadScreen dark={dark}/>
              </MacOSShell>
            </DCArtboard>
          </DCSection>

          {/* ── Section 2.7: Full markdown editor (split view) ─────── */}
          <DCSection
            title="Full markdown editor"
            subtitle="Power users can flip to split view: source on the left, live preview on the right. Full toolbar — headings, lists, tables, code, quotes, images, links.">
            <DCArtboard label="Editor · split view (markdown + preview)" width={1280} height={820}>
              <MacOSShell>
                <DesktopApp dark={dark} density={tw.density} aiMode={tw.aiPlacement}
                  selectedNoteId="n1" selectedFolder="work"
                  aiOn={true} model="meo-mini" editorMode="split"/>
              </MacOSShell>
            </DCArtboard>
          </DCSection>

          {/* ── Section 3: Dark mode variant ───────────────────────────── */}
          <DCSection
            title="Dark mode"
            subtitle="Same palette, muted. The mossy accent stays; the rust AI tint deepens. Paper becomes ink.">
            <DCArtboard label="Desktop  ·  dark" width={1280} height={820}>
              <MacOSShell dark>
                <DesktopApp dark={true} density={tw.density} aiMode={tw.aiPlacement}
                  selectedNoteId="n2" selectedFolder="travel" aiPanelOpen={false}/>
              </MacOSShell>
            </DCArtboard>
          </DCSection>

          {/* ── Section 4: Mobile ─────────────────────────────────────── */}
          <DCSection
            title="Meo for iPhone"
            subtitle="The same content model, rethought for thumbs. Folder cards, large titles, a floating composer. AI sheet slides up from the bottom.">

            <DCArtboard label="Folders" width={402} height={874} style={{ borderRadius: 48, background: 'transparent', boxShadow: 'none' }}>
              <PhoneShell dark={dark}>
                <MobileFolders dark={dark}/>
              </PhoneShell>
            </DCArtboard>

            <DCArtboard label="Folder → notes list" width={402} height={874} style={{ borderRadius: 48, background: 'transparent', boxShadow: 'none' }}>
              <PhoneShell dark={dark}>
                <MobileNotesList dark={dark}/>
              </PhoneShell>
            </DCArtboard>

            <DCArtboard label="Note — editor" width={402} height={874} style={{ borderRadius: 48, background: 'transparent', boxShadow: 'none' }}>
              <PhoneShell dark={dark}>
                <MobileNoteEditor dark={dark}/>
              </PhoneShell>
            </DCArtboard>

            <DCArtboard label="Note — Ask Meo sheet open" width={402} height={874} style={{ borderRadius: 48, background: 'transparent', boxShadow: 'none' }}>
              <PhoneShell dark={dark}>
                <MobileNoteEditor dark={dark} showAI={true}/>
              </PhoneShell>
            </DCArtboard>

            <DCPostIt top={-30} left={1180} rotate={-2} width={200}>
              Same mental model as desktop — no surprises when switching devices.
            </DCPostIt>
          </DCSection>

          {/* ── Section 5: Type + color system ───────────────────────── */}
          <DCSection
            title="Foundations"
            subtitle="What we committed to, what we didn't. Original palette — no brand copies.">
            <DCArtboard label="Type + color + voice" width={1280} height={640}>
              <Foundations/>
            </DCArtboard>
          </DCSection>

          <div style={{ height: 40 }}/>
        </DesignCanvas>

        {tweaksOn && <TweaksPanel tw={tw} update={update}/>}
      </>
    );
  }

  // ── macOS window chrome (custom — matches Meo's palette) ────────────
  function MacOSShell({ children, dark }) {
    return (
      <div style={{
        width: '100%', height: '100%', borderRadius: 12, overflow: 'hidden',
        background: dark ? '#1B1915' : '#F6F2EA',
        boxShadow: '0 0 0 1px rgba(0,0,0,0.12), 0 24px 60px rgba(0,0,0,0.18)',
      }}>
        {children}
      </div>
    );
  }

  // ── iPhone bezel shell ──────────────────────────────────────────────
  function PhoneShell({ children, dark }) {
    return (
      <div style={{
        width: 402, height: 874, borderRadius: 48, overflow: 'hidden',
        background: dark ? '#0E0D0A' : '#EDE7DA',
        boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
        position: 'relative',
      }}>
        {/* dynamic island */}
        <div style={{
          position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
          width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
        }}/>
        {/* status bar */}
        <div style={{
          position: 'absolute', top: 0, left: 0, right: 0, zIndex: 40,
          padding: '18px 28px 0',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          fontSize: 15.5, fontWeight: 600, color: dark ? '#fff' : '#1F1C17',
          fontFamily: '-apple-system, system-ui',
        }}>
          <span>9:41</span>
          <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
            <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="6" width="3" height="4" rx="0.6" fill="currentColor"/><rect x="4" y="4" width="3" height="6" rx="0.6" fill="currentColor"/><rect x="8" y="2" width="3" height="8" rx="0.6" fill="currentColor"/><rect x="12" y="0" width="3" height="10" rx="0.6" fill="currentColor"/></svg>
            <svg width="22" height="10" viewBox="0 0 22 10"><rect x="0.5" y="0.5" width="18" height="9" rx="2.5" stroke="currentColor" strokeOpacity="0.4" fill="none"/><rect x="1.8" y="1.8" width="15" height="6.4" rx="1.3" fill="currentColor"/><path d="M19.5 3.5V6.5c.8-.2 1.2-.8 1.2-1.5s-.4-1.3-1.2-1.5z" fill="currentColor"/></svg>
          </div>
        </div>
        <div style={{ width: '100%', height: '100%', overflow: 'hidden', position: 'relative' }}>
          {children}
        </div>
        {/* home indicator */}
        <div style={{
          position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.5)' : 'rgba(31,28,23,0.3)', zIndex: 60,
        }}/>
      </div>
    );
  }

  // ── Foundations board (type + color + voice) ───────────────────────
  function Foundations() {
    return (
      <div style={{ padding: 40, height: '100%', display: 'grid', gridTemplateColumns: '1.2fr 1fr 1fr', gap: 36, background: '#FFFBF3', fontFamily: MEO_FONT }}>
        {/* Type */}
        <div>
          <Label>Typography</Label>
          <div style={{ fontFamily: MEO_SERIF, fontSize: 44, fontWeight: 700, color: MEO.ink, letterSpacing: -0.8, lineHeight: 1.05, marginTop: 14 }}>
            Notes that feel like notes.
          </div>
          <div style={{ fontFamily: MEO_SERIF, fontSize: 17, color: MEO.ink2, lineHeight: 1.55, marginTop: 14, textWrap: 'pretty' }}>
            Body is Source Serif 4 — a quiet, letter-like face that slows the eye. UI labels, buttons, and counts are Inter, tight and unfussy.
          </div>
          <div style={{ marginTop: 28, display: 'grid', gridTemplateColumns: '110px 1fr', rowGap: 10, columnGap: 16, fontSize: 14, color: MEO.ink2 }}>
            <span style={{ color: MEO.ink3, fontSize: 12, textTransform: 'uppercase', letterSpacing: 0.6 }}>Display</span>
            <span style={{ fontFamily: MEO_SERIF, fontSize: 28, fontWeight: 700, color: MEO.ink }}>Source Serif 4</span>
            <span style={{ color: MEO.ink3, fontSize: 12, textTransform: 'uppercase', letterSpacing: 0.6 }}>UI</span>
            <span style={{ fontFamily: MEO_FONT, fontSize: 20, fontWeight: 600, color: MEO.ink }}>Inter — tight</span>
            <span style={{ color: MEO.ink3, fontSize: 12, textTransform: 'uppercase', letterSpacing: 0.6 }}>Mono</span>
            <span style={{ fontFamily: MEO_MONO, fontSize: 15, color: MEO.ink }}>JetBrains Mono · #tag · ⌘K</span>
          </div>
        </div>

        {/* Color */}
        <div>
          <Label>Palette</Label>
          <div style={{ marginTop: 14, display: 'flex', flexDirection: 'column', gap: 8 }}>
            {[
              { name: 'Paper', hex: '#F6F2EA', role: 'page' },
              { name: 'Ink', hex: '#1F1C17', role: 'primary text' },
              { name: 'Moss', hex: '#4F6B3A', role: 'accent — nav, links' },
              { name: 'Rust', hex: '#B4632A', role: 'AI highlight' },
              { name: 'Edge', hex: '#E3DCCC', role: 'dividers' },
            ].map(c => (
              <div key={c.name} style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{ width: 46, height: 46, borderRadius: 8, background: c.hex, border: '1px solid rgba(31,28,23,0.08)' }}/>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 600, color: MEO.ink }}>{c.name}</div>
                  <div style={{ fontSize: 11.5, color: MEO.ink3, fontFamily: MEO_MONO }}>{c.hex} · {c.role}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Voice */}
        <div>
          <Label>Voice & principles</Label>
          <div style={{ marginTop: 14, display: 'flex', flexDirection: 'column', gap: 14 }}>
            {[
              ['Markdown behind the scenes', 'You write what you see. Power users can toggle the source; everyone else never meets it.'],
              ['AI is a collaborator, not a pop-up', 'One entry point (⌘K), one side panel, one slash. No modals begging for attention.'],
              ['Paper, not glass', 'Warm tones and a serif body make long notes feel like a notebook, not a terminal.'],
            ].map(([h, b]) => (
              <div key={h}>
                <div style={{ fontSize: 14, fontWeight: 600, color: MEO.ink, marginBottom: 2 }}>{h}</div>
                <div style={{ fontSize: 13, color: MEO.ink2, lineHeight: 1.5, textWrap: 'pretty' }}>{b}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  function Label({ children }) {
    return <div style={{ fontSize: 11, fontWeight: 700, color: MEO.ink3, textTransform: 'uppercase', letterSpacing: 1 }}>{children}</div>;
  }

  // ── Tweaks panel ────────────────────────────────────────────────────
  function TweaksPanel({ tw, update }) {
    const row = (label, val, opts) => (
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 10.5, fontWeight: 600, color: MEO.ink3, textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 6 }}>{label}</div>
        <div style={{ display: 'flex', gap: 4, background: 'rgba(31,28,23,0.06)', borderRadius: 7, padding: 2 }}>
          {opts.map(o => (
            <button key={o.v} onClick={() => update({ [o.k]: o.v })}
              style={{
                flex: 1, padding: '6px 10px', borderRadius: 5, border: 'none',
                background: val === o.v ? '#fff' : 'transparent',
                boxShadow: val === o.v ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
                fontSize: 12, fontWeight: val === o.v ? 600 : 500,
                color: val === o.v ? MEO.ink : MEO.ink2, cursor: 'pointer',
              }}>{o.label}</button>
          ))}
        </div>
      </div>
    );
    return (
      <div style={{
        position: 'fixed', bottom: 20, right: 20, width: 280, zIndex: 1000,
        background: '#FFFBF3', border: '1px solid #E3DCCC', borderRadius: 12,
        boxShadow: '0 20px 60px rgba(0,0,0,0.18)',
        padding: 16, fontFamily: MEO_FONT,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: MEO.ink, flex: 1 }}>Tweaks</div>
          <div style={{ fontSize: 11, color: MEO.ink3 }}>Meo</div>
        </div>
        {row('Theme', tw.theme, [
          { k: 'theme', v: 'light', label: 'Light' },
          { k: 'theme', v: 'dark', label: 'Dark' },
        ])}
        {row('Density', tw.density, [
          { k: 'density', v: 'compact', label: 'Compact' },
          { k: 'density', v: 'balanced', label: 'Balanced' },
          { k: 'density', v: 'airy', label: 'Airy' },
        ])}
        {row('AI placement', tw.aiPlacement, [
          { k: 'aiPlacement', v: 'slash', label: 'Slash' },
          { k: 'aiPlacement', v: 'panel', label: 'Panel' },
          { k: 'aiPlacement', v: 'both', label: 'Both' },
        ])}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
